<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <div id="categories">
        <h3>Select a Category</h3>
        <button id="htmlBtn">HTML</button>
        <button id="cssBtn">CSS</button>
        <button id="jsBtn">JavaScript</button>
      </div>

      <h3 id="question"></h3>

      <div class="quiz-meta" id="quizMeta" style="display: none">
        <p id="questionNum"></p>
        <p id="attempt"></p>
      </div>

      <div class="progress-wrap" id="progressWrap" style="display: none">
        <div class="progress-top">
          <span>Progress</span>
          <span id="progressPercent">0%</span>
        </div>

        <div class="progress-track">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </div>

      <div id="answers"></div>
      <button id="next" style="display: none">Next</button>
      <button id="again" style="display: none">Try again</button>
    </div>
    <div id="toast" class="toast-notification">Good</div>

    <script src="script.js"></script>
  </body>
</html>
